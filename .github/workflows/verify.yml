name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install verification tools
        run: |
          python -m pip install "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install \
            "hatchling==1.28.0" \
            "build==1.4.0" \
            "ruff==0.14.14" \
            "mypy==1.19.1" \
            "pytest==9.0.3" \
            "pip-audit==2.10.0"
          python -m pip install --no-deps -e .
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Static typing
        run: mypy src scripts
      - name: Tests
        run: pytest
      - name: Reproducible synthetic demo
        run: |
          mkdir demo-output
          python scripts/demo.py --output demo-output/report.json
          cp demo-output/report.json demo-output/report-first.json
          python scripts/demo.py --output demo-output/report.json
          cmp demo-output/report-first.json demo-output/report.json
          python scripts/comparison_demo.py --output demo-output/comparison.json
          cp demo-output/comparison.json demo-output/comparison-first.json
          python scripts/comparison_demo.py --output demo-output/comparison.json
          cmp demo-output/comparison-first.json demo-output/comparison.json
          python scripts/human_evidence_demo.py --output demo-output/human-evidence.json
          cp demo-output/human-evidence.json demo-output/human-evidence-first.json
          python scripts/human_evidence_demo.py --output demo-output/human-evidence.json
          cmp demo-output/human-evidence-first.json demo-output/human-evidence.json
          python scripts/judge_evidence_demo.py --output demo-output/judge-evidence.json
          cp demo-output/judge-evidence.json demo-output/judge-evidence-first.json
          python scripts/judge_evidence_demo.py --output demo-output/judge-evidence.json
          cmp demo-output/judge-evidence-first.json demo-output/judge-evidence.json
      - name: Verify checked release evidence
        run: |
          python scripts/release_evidence.py \
            --output-dir evidence/v1.0.0 \
            --verify
      - name: Build and verify release artifacts
        run: python scripts/release_verify.py --output-dir release-artifacts
      - name: Dependency consistency
        run: python -m pip check
      - name: Vulnerability audit
        run: python -m pip_audit --skip-editable
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evalforge-v1.0.0-python-${{ matrix.python-version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
