[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.2.0"
description = "A deterministic, provenance-first evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nguyen Gia Phu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D100", "D103"]
"src/evalforge/io.py" = ["C901", "D100", "D103", "EM101", "EM102", "PLR2004", "TRY003"]
"src/evalforge/engine.py" = ["D100", "D103", "EM101", "EM102", "PLR2004", "TRY003"]
"src/evalforge/canonical.py" = ["EM101", "TRY003"]
"src/evalforge/comparison.py" = [
  "D103",
  "EM101",
  "EM102",
  "PLR0913",
  "PLR2004",
  "TRY003",
]
"src/evalforge/models.py" = ["D100", "D101"]
"tests/**" = [
  "D100",
  "D103",
  "PLR2004",
  "S101",
  "TC003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["evalforge"]
mypy_path = "src"
